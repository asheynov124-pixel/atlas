<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cosmopolis</title>
    <meta name="description" content="Build cities on living planets, unlock worlds and galaxies, and play god." />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#02030a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cosmopolis" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, #0d1640 0%, #02030a 70%); z-index: 100; transition: opacity .6s; }
      #boot .orb { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9ff6ff, #2a7bff 45%, #0a1030 75%); box-shadow: 0 0 60px #2a7bff88, inset -10px -14px 30px #000a; animation: spin 3s linear infinite; }
      #boot .t { margin-top: 26px; font: 600 13px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .5em; color: #bfe8ff; text-align: center; }
      @keyframes spin { to { filter: hue-rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div style="display:flex;flex-direction:column;align-items:center"><div class="orb"></div><div class="t">COSMOPOLIS</div></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
