<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'>
<title>Jelly Loop</title>
<meta name='description' content='Send jellies round the belt to pop the picture.'>
<meta name='theme-color' content='#1e1b4b'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='apple-mobile-web-app-title' content='Jelly Loop'>
<link rel='manifest' href='manifest.webmanifest'>
<link rel='apple-touch-icon' href='icons/icon-192.png'>
<link rel='icon' type='image/png' href='icons/icon-192.png'>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{background:#1e1b4b}
body{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(120% 80% at 50% 0%,#4f46e5 0%,#312e81 50%,#1e1b4b 100%)}
[hidden]{display:none!important}
#game{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 6px calc(env(safe-area-inset-left) + 10px)}
#hud button{flex:none;width:40px;height:40px;padding:0;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font:700 17px system-ui,sans-serif}
#hud button.on{background:#fde047;color:#422006}
#hud button.off{opacity:.45;text-decoration:line-through}
#title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12px;color:#c7d2fe}
#title b{font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track{height:5px;margin-top:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
#bar{width:0;height:100%;border-radius:3px;background:#4ade80;transition:width .2s}
#hint{position:absolute;left:4%;right:4%;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:420px;margin:0 auto;padding:10px 14px;border-radius:14px;background:rgba(15,23,42,.9);font-size:14px;line-height:1.35;text-align:center;pointer-events:none}
#safe{position:absolute;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom);pointer-events:none}
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.62)}
.card{width:100%;max-width:340px;padding:22px;border-radius:22px;background:#eef2ff;color:#1e1b4b;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card h1{margin:0 0 8px;font-size:26px}
.won h1{color:#15803d}
.lost h1{color:#b91c1c}
.card p{margin:0 0 16px;font-size:15px;line-height:1.4;color:#3730a3}
.go{flex:none;width:100%;padding:14px;border:0;border-radius:14px;background:#4f46e5;color:#fff;font:700 17px system-ui,sans-serif}
#home{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#4f46e5 0%,#312e81 50%,#1e1b4b 100%)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:480px;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 12px)}
#top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
#top h1{flex:1;margin:0;font-size:26px;letter-spacing:-.5px;white-space:nowrap}
#mascot{flex:none;width:44px;height:44px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700;font-size:14px}
.pill em{font-style:normal;color:#fde047}
.coin{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;background:#facc15;box-shadow:inset 0 0 0 2px #ca8a04}
#tabs{display:flex;gap:6px;margin:14px 0 10px;padding:4px;border-radius:14px;background:rgba(15,23,42,.35)}
#tabs button{flex:1;padding:9px 0;border:0;border-radius:10px;background:none;color:#c7d2fe;font:700 14px system-ui,sans-serif}
#tabs button.on{background:#eef2ff;color:#1e1b4b}
.pane{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.lv{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-height:112px;padding:8px 4px;border:2px solid transparent;border-radius:14px;background:#fff;color:#1e1b4b;font:600 12px system-ui,sans-serif}
.lv.current{border-color:#fde047}
.lv.locked{background:#c7d2fe;color:#6366f1}
.lv i{width:28px;height:28px;margin-bottom:14px;border-radius:8px;background:#a5b4fc}
.lv canvas{image-rendering:pixelated}
.stars b{color:#cbd5e1;font-size:13px}
.stars b.on{color:#f59e0b}
.card .stars b{font-size:38px;margin:0 2px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px;border-radius:16px;background:#eef2ff;color:#1e1b4b}
.tag{display:flex;flex:none;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#4f46e5;color:#fff;font:800 14px system-ui,sans-serif}
.done .tag{background:#16a34a;font-size:20px}
.body{flex:1;min-width:0}
.row h2{margin:0;font-size:15px}
.row p{margin:2px 0 0;font-size:12px;line-height:1.35;color:#4338ca}
.row small{display:block;margin-top:4px;font-size:11px;font-weight:700;color:#6366f1}
.price{display:inline-flex;flex:none;align-items:center;gap:5px;font-weight:800;font-size:14px}
.price.paid{color:#16a34a}
.price.paid .coin{display:none}
.buy{flex:none;min-width:64px;padding:10px 12px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font:800 14px system-ui,sans-serif}
.buy:disabled{background:#c7d2fe;color:#6366f1}
.meter{height:5px;margin-top:6px;border-radius:3px;background:#c7d2fe;overflow:hidden}
.meter i{display:block;height:100%;background:#4f46e5}
.note{margin:8px 6px;font-size:12px;line-height:1.4;color:#c7d2fe;text-align:center}
#install{flex:none;margin:10px 0 0}
#pGain{display:flex;align-items:center;justify-content:center;gap:6px;margin:-6px 0 16px;font-weight:800;font-size:17px;color:#1e1b4b}
.alt{margin-top:8px;background:none;color:#4f46e5}
#toast{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 64px);left:50%;padding:10px 16px;border-radius:999px;background:#fde047;color:#422006;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;transform:translateX(-50%)}
#toast.show{animation:toast 2.3s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
</style>
</head>
<body>
<canvas id='game'></canvas>
<header id='hud'>
<button id='bHome' aria-label='Home'>&#9776;</button>
<div id='title'><b id='lvName'></b><span><span id='lvNum'></span> &middot; <span id='left'></span> left &middot; <span id='time'></span></span><div id='track'><div id='bar'></div></div></div>
<button id='bSpeed' aria-label='Speed'>1x</button>
<button id='bSound' aria-label='Sound'>&#9834;</button>
<button id='bRestart' aria-label='Restart'>&#8635;</button>
</header>
<div id='hint'>Tap a jelly to send it round the belt. It pops the outermost cube of its own colour in each row and column it passes.</div>
<div id='panel' class='overlay' hidden><div class='card'><h1 id='pTitle'></h1><div id='pStars'></div><p id='pText'></p><div id='pGain'><i class='coin'></i><span id='pGainN'></span></div><button id='pGo' class='go'></button><button id='pHome' class='go alt'>Home</button></div></div>
<div id='home'><div class='sheet'><div id='top'><canvas id='mascot' width='132' height='132'></canvas><h1>Jelly Loop</h1><span class='pill'><i class='coin'></i><span id='coins'></span></span><span class='pill'><em>&#9733;</em><span id='starsN'></span></span></div>
<button id='bPlay' class='go'></button>
<div id='tabs'><button id='t-list'>Levels</button><button id='t-shop'>Upgrades</button><button id='t-wall'>Awards</button></div>
<div id='list' class='pane'></div><div id='shop' class='pane' hidden></div><div id='wall' class='pane' hidden></div>
<p id='install' class='note'>To install on a phone: tap Share, then <b>Add to Home Screen</b>.</p></div></div>
<div id='toast' hidden></div>
<div id='safe'></div>
<script src='core.js'></script>
<script src='levels.js'></script>
<script src='render.js'></script>
<script src='home.js'></script>
<script src='app.js'></script>
</body>
</html>
