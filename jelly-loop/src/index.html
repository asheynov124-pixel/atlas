<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'>
<title>Jelly Loop</title>
<meta name='description' content='Send jellies round the loop to pop the picture.'>
<meta name='theme-color' content='#1e1b4b'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='apple-mobile-web-app-title' content='Jelly Loop'>
<link rel='manifest' href='manifest.webmanifest'>
<link rel='apple-touch-icon' href='icons/icon-192.png'>
<link rel='icon' type='image/png' href='icons/icon-192.png'>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{--bg1:#4f46e5;--bg2:#312e81;--bg3:#1e1b4b;background:var(--bg3)}
body{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%)}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.96)}
#game{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.pill{display:inline-flex;flex:none;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border:0;border-radius:999px;background:rgba(15,23,42,.45);font-weight:800;font-size:15px}
.pill em{font-style:normal;color:#fde047}
.coin{display:inline-block;flex:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fef08a,#facc15 55%,#ca8a04);box-shadow:inset 0 0 0 2px #a16207}
.heart{color:#f43f5e;font-size:20px;line-height:1}
.dim{color:#c7d2fe;font-weight:700;font-size:12px}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 6px calc(env(safe-area-inset-left) + 10px)}
#title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:#c7d2fe}
#title b,#title>span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title b{font-size:17px;color:#fff}
#track{width:100%;max-width:200px;height:5px;margin-top:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
#bar{width:0;height:100%;border-radius:3px;background:#4ade80;transition:width .2s}
.sq{flex:none;width:42px;height:42px;padding:0;border:0;border-radius:13px;background:linear-gradient(#6366f1,#4338ca);box-shadow:0 3px 0 #312e81;font:800 15px system-ui,sans-serif}
#boost{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(rgba(30,27,75,0),rgba(30,27,75,.9) 30%)}
#boost button{position:relative;width:62px;height:56px;border:0;border-radius:16px;background:linear-gradient(#818cf8,#4f46e5);box-shadow:0 4px 0 #312e81;font-size:26px}
#boost button.on{background:linear-gradient(#fde047,#f59e0b);box-shadow:0 4px 0 #b45309}
#boost button b,.tile b{position:absolute;right:-5px;top:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ef4444;box-shadow:0 0 0 2px #1e1b4b;font-size:12px;line-height:22px;text-align:center}
#boost button b.plus,.tile b.plus{background:#22c55e}
#tip{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:12px;right:12px;max-width:420px;margin:0 auto;padding:10px 14px;border-radius:14px;background:#fde047;color:#422006;font-size:14px;font-weight:700;line-height:1.3;text-align:center;pointer-events:none}
#hint{position:absolute;left:4%;right:4%;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:420px;margin:0 auto;padding:10px 14px;border-radius:14px;background:rgba(15,23,42,.92);font-size:14px;line-height:1.35;text-align:center;pointer-events:none}
#safe{position:absolute;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom);pointer-events:none}
.overlay{position:absolute;z-index:3;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.66)}
.card{position:relative;width:100%;max-width:350px;max-height:100%;overflow-y:auto;padding:22px;border-radius:24px;background:#eef2ff;color:#1e1b4b;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card h1{margin:0 0 8px;font-size:26px}
.card h3{margin:14px 0 8px;font-size:15px}
.won h1{color:#15803d}
.lost h1{color:#b91c1c}
.card p{margin:0 0 14px;font-size:15px;line-height:1.4;color:#3730a3}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#ef4444;color:#fff;font:800 20px system-ui,sans-serif;line-height:34px}
.go{display:block;flex:none;width:100%;margin-top:8px;padding:14px;border:0;border-radius:16px;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 4px 0 #166534;color:#fff;font:800 18px system-ui,sans-serif}
.go:disabled{background:#cbd5e1;box-shadow:0 4px 0 #94a3b8;color:#64748b}
.alt{background:linear-gradient(#818cf8,#4f46e5);box-shadow:0 4px 0 #312e81}
.plain{background:none;box-shadow:none;color:#4f46e5}
.stars b{color:#cbd5e1;font-size:13px}
.stars b.on{color:#f59e0b}
.card .stars b{font-size:40px;margin:0 2px}
.gain{display:flex;align-items:center;justify-content:center;gap:14px;margin:-4px 0 12px;font-weight:800;font-size:17px}
.gain span{display:inline-flex;align-items:center;gap:5px}
#home{position:absolute;z-index:2;top:0;right:0;bottom:0;left:0;display:flex;justify-content:center;background:radial-gradient(120% 70% at 50% 0%,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:480px;padding:calc(env(safe-area-inset-top) + 10px) 0 0}
#top{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
#top .grow{flex:1}
#pages{position:relative;flex:1;min-height:0}
.page{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 14px}
#pg-map{display:flex;flex-direction:column;padding:0}
#map{flex:1;min-height:0;display:flex;flex-direction:column-reverse;align-items:center;gap:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 0}
.lvl{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;width:150px;padding:10px 10px 6px;border:0;border-radius:22px;background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 5px 0 #1e40af;color:#fff}
.lvl canvas{border-radius:10px;background:#cbd5e1;image-rendering:pixelated}
.lvl strong{font-size:24px;line-height:1.2;-webkit-text-stroke:1px #1e3a8a}
.lvl.done{background:linear-gradient(#a5b4fc,#6366f1);box-shadow:0 5px 0 #3730a3}
.lvl.now{transform:scale(1.12);background:linear-gradient(#fde047,#f59e0b);box-shadow:0 5px 0 #b45309,0 0 30px rgba(253,224,71,.6)}
.lvl.now strong{-webkit-text-stroke:1px #92400e}
.lvl.lock{opacity:.6}
.lvl.fresh{background:linear-gradient(#34d399,#059669);box-shadow:0 5px 0 #065f46}
.lvl .tagnew{position:absolute;top:-9px;right:-6px;padding:2px 7px;border-radius:9px;background:#ef4444;font-style:normal;font-size:11px;font-weight:800}
.lvl .pz{position:absolute;bottom:6px;right:8px;font-size:13px;font-weight:800}
.lvl .stars{position:absolute;top:-10px}
.lvl .stars b{font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.road{flex:none;width:14px;height:26px;background:rgba(15,23,42,.5)}
.side{position:absolute;z-index:1;top:8px;display:flex;flex-direction:column;gap:14px}
.side.l{left:8px}
.side.r{right:8px}
.sb{position:relative;display:flex;flex-direction:column;align-items:center;width:62px;padding:0;border:0;background:none}
.sb i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(#818cf8,#4338ca);box-shadow:0 3px 0 #312e81;font-style:normal;font-size:26px}
.sb span{margin-top:-6px;padding:1px 6px;border-radius:8px;background:#fef3c7;color:#78350f;font-size:11px;font-weight:800;white-space:nowrap}
.sb b{position:absolute;top:-2px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ef4444;font-size:12px;line-height:20px}
#bPlay{flex:none;width:auto;margin:6px 40px 10px;padding:16px;font-size:26px;border-radius:22px}
#nav{display:flex;align-items:flex-end;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(#4338ca,#312e81);box-shadow:0 -2px 0 #6366f1}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:0;border-radius:14px;background:none;color:#c7d2fe;font-size:11px;font-weight:800}
#nav button i{font-style:normal;font-size:24px;line-height:1.1}
#nav button.on{background:rgba(255,255,255,.14);color:#fff}
.row{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px;border-radius:16px;background:#eef2ff;color:#1e1b4b;text-align:left}
.tag{display:flex;flex:none;align-items:center;justify-content:center;width:46px;height:46px;border-radius:13px;background:#4f46e5;color:#fff;font:800 22px system-ui,sans-serif}
.done .tag{background:#16a34a}
.body{flex:1;min-width:0}
.row h2{margin:0;font-size:15px}
.row p{margin:2px 0 0;font-size:12px;line-height:1.35;color:#4338ca}
.row small{display:block;margin-top:4px;font-size:11px;font-weight:700;color:#6366f1}
.price{display:inline-flex;flex:none;align-items:center;gap:5px;font-weight:800;font-size:14px}
.price.paid{color:#16a34a}
.price.paid .coin{display:none}
.buy{flex:none;min-width:70px;padding:10px 12px;border:0;border-radius:12px;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 3px 0 #166534;color:#fff;font:800 14px system-ui,sans-serif}
.buy:disabled{background:#c7d2fe;box-shadow:0 3px 0 #a5b4fc;color:#6366f1}
.meter{height:7px;margin-top:6px;border-radius:4px;background:#c7d2fe;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a)}
.head{margin:6px 4px 10px;font-size:20px;font-weight:800}
.note{margin:8px 6px;font-size:12px;line-height:1.4;color:#c7d2fe;text-align:center}
.card .note{color:#6366f1}
.tiles{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:84px;height:80px;padding:0;border:3px solid transparent;border-radius:18px;background:linear-gradient(#93c5fd,#3b82f6);box-shadow:0 3px 0 #1d4ed8;font-size:32px}
.tile small{font-size:10px;font-weight:800;color:#fff;white-space:nowrap}
.tile.on{border-color:#facc15;background:linear-gradient(#fde047,#f59e0b);box-shadow:0 3px 0 #b45309}
.tile.free b{background:#16a34a}
.streak{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#fef3c7;text-align:left}
.streak .fire{font-size:30px}
.steps{flex:1;display:flex;gap:4px;margin-top:4px}
.steps i{flex:1;height:9px;border-radius:5px;background:#fde68a}
.steps i.on{background:#f97316}
.pic{display:block;margin:4px auto 6px;border-radius:12px;background:#cbd5e1;image-rendering:pixelated}
.chests{display:flex;justify-content:space-around;margin:4px 0 12px}
.chest{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:0;border-radius:14px;background:#e0e7ff;font-size:30px}
.chest small{font-size:11px;font-weight:800;color:#3730a3}
.chest.ready{background:linear-gradient(#fde047,#f59e0b);box-shadow:0 0 18px rgba(245,158,11,.7)}
.chest.got{opacity:.45}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:6px 2px;border-radius:14px;background:#e0e7ff;font-size:24px}
.day small{font-size:10px;font-weight:800;color:#3730a3}
.day.today{background:linear-gradient(#fde047,#f59e0b)}
.day.got{opacity:.45}
.track{display:flex;flex-direction:column;gap:6px;text-align:left}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#e0e7ff}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:#a5b4fc;color:#fff;font-weight:800;line-height:32px;text-align:center}
.step.reach .n{background:#16a34a}
.step .what{flex:1;font-weight:800;font-size:14px}
.set{display:flex;align-items:center;justify-content:space-between;margin:6px 0;padding:10px 12px;border-radius:14px;background:#e0e7ff;font-weight:800}
.set button{min-width:64px;padding:8px 10px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:800 14px system-ui,sans-serif}
.set button.off{background:#94a3b8}
#toast{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 64px);left:50%;padding:10px 16px;border-radius:999px;background:#fde047;color:#422006;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;transform:translateX(-50%)}
#toast.show{animation:toast 2.3s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.tabs{display:flex;gap:6px;margin:0 2px 12px}
.tabs button{flex:1;padding:9px 4px;border:0;border-radius:12px;background:rgba(15,23,42,.4);color:#c7d2fe;font:800 13px system-ui,sans-serif}
.tabs button.on{background:#fde047;color:#422006}
.sub{margin:14px 4px 8px;font-size:15px}
.deal{position:relative;margin-bottom:10px;padding:16px 14px 14px;border-radius:18px;background:linear-gradient(#fef3c7,#fde68a);color:#422006;text-align:center;box-shadow:0 4px 0 #d97706}
.deal .big{font-size:40px;line-height:1.1}
.deal h2{margin:4px 0;font-size:17px}
.deal p{margin:0 0 4px;font-size:13px}
.deal small{display:block;margin-bottom:10px;font-size:11px;font-weight:700;color:#92400e}
.ribbon{position:absolute;top:10px;left:-4px;padding:3px 10px;border-radius:0 10px 10px 0;background:#ef4444;color:#fff;font-size:11px;font-weight:800}
.buys{display:flex;flex-direction:column;gap:6px}
.buy .qty{margin-right:6px;font-size:12px;opacity:.85}
.swatch{border:3px solid #fff}
.tag.face{background:#e0e7ff}
.wheel{position:relative;width:250px;height:250px;margin:4px auto 10px}
.wheel canvas{display:block;border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.wheel .pin{position:absolute;z-index:1;top:-6px;left:50%;width:0;height:0;margin-left:-12px;border:12px solid transparent;border-top:22px solid #ef4444}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:-4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 4px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{padding:8px 4px;border-radius:12px;background:#e0e7ff}
.stats b{display:block;font-size:17px}
.stats small{font-size:10px;font-weight:700;color:#4338ca}
</style>
</head>
<body>
<canvas id='game'></canvas>
<header id='hud'>
<span class='pill'><i class='coin'></i><span id='hCoins'></span></span>
<div id='title'><b id='lvName'></b><span><span id='lvNum'></span> &middot; <span id='left'></span> left &middot; <span id='time'></span></span><div id='track'><div id='bar'></div></div></div>
<button id='bPause' class='sq' aria-label='Pause'>II</button>
</header>
<nav id='boost'>
<button id='k-bolt' aria-label='Bolt'>&#9889;<b></b></button>
<button id='k-grab' aria-label='Grabber'>&#129522;<b></b></button>
<button id='k-squish' aria-label='Squish'>&#128279;<b></b></button>
<button id='k-slot' aria-label='Extra place'>&#10133;<b></b></button>
</nav>
<div id='tip' hidden></div>
<div id='hint'>Tap a jelly: it rides once round the picture, popping cubes of its colour, then lands on the belt. Tap a landed jelly to send it again. If one comes back to a full belt, the round is lost.</div>
<div id='panel' class='overlay' hidden><div class='card'><h1 id='pTitle'></h1><div id='pStars' class='stars'></div><p id='pText'></p><div id='pGain' class='gain'></div><div id='pBtns'></div></div></div>
<div id='pause' class='overlay' hidden><div class='card'><h1>Paused</h1><div class='set'>Sound<button id='tSound'></button></div><div class='set'>Game speed<button id='tSpeed'></button></div><button id='bResume' class='go'>Resume</button><button id='bRestart' class='go alt'>Restart</button><button id='bQuit' class='go plain'>Quit to map</button><p id='qNote' class='note'></p></div></div>
<div id='home'><div class='sheet'>
<div id='top'><button id='tCoins' class='pill'><i class='coin'></i><span id='coins'></span><em>+</em></button><button id='tHearts' class='pill'><span class='heart'>&#10084;</span><span id='hearts'></span><span id='heartT' class='dim'></span></button><span class='grow'></span><button id='bSet' class='sq' aria-label='Settings'>&#9881;</button></div>
<div id='pages'>
<section id='pg-map' class='page'>
<div class='side l'><button id='sTasks' class='sb'><i>&#128203;</i><span id='sTasksT'></span><b hidden></b></button><button id='sRoad' class='sb'><i>&#128273;</i><span id='sRoadT'></span><b hidden></b></button><button id='sDaily' class='sb'><i>&#128197;</i><span id='sDailyT'></span><b hidden></b></button></div>
<div class='side r'><button id='sGift' class='sb'><i>&#127873;</i><span id='sGiftT'></span><b hidden></b></button><button id='sStreak' class='sb'><i>&#128293;</i><span id='sStreakT'></span></button><button id='sWheel' class='sb'><i>&#127905;</i><span id='sWheelT'></span><b hidden></b></button></div>
<div id='map'></div>
<button id='bPlay' class='go'>Play</button>
</section>
<section id='pg-shop' class='page' hidden></section>
<section id='pg-up' class='page' hidden></section>
<section id='pg-awards' class='page' hidden></section>
</div>
<nav id='nav'><button id='n-shop'><i>&#128717;</i>Shop</button><button id='n-up'><i>&#128295;</i>Upgrades</button><button id='n-map'><i>&#127968;</i>Home</button><button id='n-awards'><i>&#127942;</i>Awards</button></nav>
</div></div>
<div id='modal' class='overlay' hidden><div class='card'><button id='mX' class='x' aria-label='Close'>&times;</button><div id='mBody'></div></div></div>
<div id='toast' hidden></div>
<div id='safe'></div>
<script src='core.js'></script>
<script src='levels.js'></script>
<script src='deal.js'></script>
<script src='render.js'></script>
<script src='home.js'></script>
<script src='app.js'></script>
</body>
</html>
